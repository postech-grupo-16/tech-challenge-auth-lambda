name: Lambda CI/CD Pipeline

# Dois ambientes, escolhidos pela branch:
#   main    -> production (infra/environments/production.*, secret TF_VAR_JWT_SECRET, variavel APP_BACKEND_URL)
#   homolog -> homolog    (infra/environments/homolog.*, secret TF_VAR_JWT_SECRET_HOMOLOG, variavel APP_BACKEND_URL_HOMOLOG)
on:
  push:
    branches: [ "main", "homolog" ]
  pull_request:
    branches: [ "main", "homolog" ]
  workflow_dispatch:
    inputs:
      action:
        description: "Ação do Terraform (apenas para push/dispatch na main ou homolog)"
        required: true
        type: choice
        default: "apply"
        options:
          - plan
          - apply
          - destroy

env:
  AWS_REGION: us-east-1
  # base_ref = branch de destino do PR; ref_name = branch do push/dispatch.
  DEPLOY_ENV: ${{ (github.base_ref || github.ref_name) == 'homolog' && 'homolog' || 'production' }}
  TF_VAR_jwt_secret: ${{ secrets[(github.base_ref || github.ref_name) == 'homolog' && 'TF_VAR_JWT_SECRET_HOMOLOG' || 'TF_VAR_JWT_SECRET'] }}
  TF_VAR_app_backend_url: ${{ vars[(github.base_ref || github.ref_name) == 'homolog' && 'APP_BACKEND_URL_HOMOLOG' || 'APP_BACKEND_URL'] }}

jobs:
  # JOB 1: TESTES
  test:
    name: Testes Unitários
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

  # JOB 2: TERRAFORM PLAN (valida a infra em todo push/PR)
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'plan'

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências de produção
        run: npm ci --omit=dev

      - name: Empacotar a Lambda
        run: |
          mkdir -p build
          zip -r build/lambda.zip src node_modules package.json -x '*.test.js'

      - name: Verificar secret do ambiente
        run: |
          if [ -z "$TF_VAR_jwt_secret" ]; then
            echo "::error::Secret JWT nao configurado para '$DEPLOY_ENV' (em homolog: TF_VAR_JWT_SECRET_HOMOLOG)"
            exit 1
          fi

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false -backend-config="environments/$DEPLOY_ENV.s3.tfbackend"

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -input=false -no-color -var-file="environments/$DEPLOY_ENV.tfvars"

  # JOB 3: DEPLOY (apply automático em push na main/homolog, ou dispatch manual)
  deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homolog' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.action != 'plan')
    environment: ${{ github.ref_name == 'homolog' && 'homolog' || 'production' }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências de produção
        run: npm ci --omit=dev

      - name: Empacotar a Lambda
        run: |
          mkdir -p build
          zip -r build/lambda.zip src node_modules package.json -x '*.test.js'

      - name: Verificar secret do ambiente
        run: |
          if [ -z "$TF_VAR_jwt_secret" ]; then
            echo "::error::Secret JWT nao configurado para '$DEPLOY_ENV' (em homolog: TF_VAR_JWT_SECRET_HOMOLOG)"
            exit 1
          fi

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false -backend-config="environments/$DEPLOY_ENV.s3.tfbackend"

      - name: Terraform Apply ou Destroy
        working-directory: infra
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.action || 'apply' }}" = "destroy" ]; then
            terraform destroy -input=false -auto-approve -var-file="environments/$DEPLOY_ENV.tfvars"
          else
            terraform apply -input=false -auto-approve -var-file="environments/$DEPLOY_ENV.tfvars"
            terraform output
          fi
