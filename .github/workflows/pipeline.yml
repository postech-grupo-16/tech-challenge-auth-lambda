name: Lambda CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      action:
        description: "Ação do Terraform (apenas para push/dispatch na main)"
        required: true
        type: choice
        default: "apply"
        options:
          - plan
          - apply
          - destroy

env:
  AWS_REGION: us-east-1

jobs:
  # JOB 1: TESTES
  test:
    name: Testes Unitários
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

  # JOB 2: TERRAFORM PLAN (valida a infra em todo push/PR)
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'plan'

    env:
      TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
      TF_VAR_app_backend_url: ${{ vars.APP_BACKEND_URL }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências de produção
        run: npm ci --omit=dev

      - name: Empacotar a Lambda
        run: |
          mkdir -p build
          zip -r build/lambda.zip src node_modules package.json -x '*.test.js'

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -input=false -no-color

  # JOB 3: DEPLOY (apply automático em push na main, ou dispatch manual)
  deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.action != 'plan')
    environment: production

    env:
      TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
      TF_VAR_app_backend_url: ${{ vars.APP_BACKEND_URL }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências de produção
        run: npm ci --omit=dev

      - name: Empacotar a Lambda
        run: |
          mkdir -p build
          zip -r build/lambda.zip src node_modules package.json -x '*.test.js'

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform Apply ou Destroy
        working-directory: infra
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.action || 'apply' }}" = "destroy" ]; then
            terraform destroy -input=false -auto-approve
          else
            terraform apply -input=false -auto-approve
            terraform output
          fi
